services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: visy
      POSTGRES_USER: visy
      POSTGRES_PASSWORD: visy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - visy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visy -d visy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  visy_postgres:
